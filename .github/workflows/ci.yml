name: No-account checks

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install the namespace and policy test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes bubblewrap apparmor
          /usr/bin/python3 --version
          /usr/bin/git --version
          /usr/bin/bwrap --version

      - name: Prepare the scoped CI namespace profile
        run: |
          set -euo pipefail
          umask 077
          relay_ci_dir="$(mktemp -d /tmp/relay-ci.XXXXXXXX)"
          cat > "$relay_ci_dir/profile" <<'POLICY'
          abi <abi/4.0>,
          # This broad compatibility exception applies through explicit entry
          # on this disposable CI VM. It is not a tight AppArmor sandbox.
          # No executable attachment or profile transition replaces host policy.
          # Bubblewrap retains procfs descriptors across pivot_root for ID maps.
          # This flag permits that disconnected-path lookup. It can alias paths,
          # so this broad CI profile is not a filesystem confinement boundary.
          profile relay-ci flags=(attach_disconnected) {
            file rwlkm /{**,},
            /** ix,
            capability,
            network,
            unix,
            mount,
            umount,
            pivot_root,
            ptrace,
            signal,
            userns,
          }
          POLICY
          cat > "$relay_ci_dir/ci.py" <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import sys

          PROFILE = b'relay-ci (enforce)'
          NAMESPACES = ('user', 'mnt', 'pid', 'net')
          # Literal diagnostic prefixes from bubblewrap v0.9.0; values never print.
          BWRAP_FAILURES = {
              'loopback': (b'loopback: Failed ',),
              'mount_proc': (b"Can't mount proc on ", b"Can't mount tmpfs on ",
                             b"Can't mount devpts on ", b"Can't bind mount ",
                             b"Can't remount readonly on ", b'Failed to make / slave',
                             b'Failed to mount tmpfs', b'setting up newroot bind'),
              'pivot_root': (b'pivot_root',),
              'exec': (b'execvp ',),
              'capability': (b'capset failed', b'capget failed',
                             b'Adding ambient capability ', b'Dropping capability '),
              'id_mapping': (b'setting up uid map', b'setting up gid map',
                             b'error writing to setgroups'),
          }

          def classify_bwrap(data):
              if len(data) <= 65536:
                  for category, prefixes in BWRAP_FAILURES.items():
                      if any(data.startswith(b'bwrap: ' + prefix) for prefix in prefixes):
                          return category
              return 'unknown'

          class CheckFailure(Exception):
              pass

          def require(condition, label='relay_ci_precondition=failed'):
              if not condition:
                  raise CheckFailure(label)

          def bounded(path, limit=65536):
              try:
                  with open(path, 'rb') as stream:
                      data = stream.read(limit + 1)
              except OSError:
                  raise CheckFailure('relay_ci_state_read=failed') from None
              require(len(data) <= limit, 'relay_ci_state_bound=failed')
              return data

          def check_identity(uid, gid):
              require(uid > 0 and os.getresuid() == (uid, uid, uid), 'relay_ci_uid=failed')
              require(os.getresgid() == (gid, gid, gid), 'relay_ci_gid=failed')
              require(not os.getgroups(), 'relay_ci_groups=failed')
              status = dict(line.split(b':', 1) for line in
                            bounded('/proc/self/status').splitlines())
              require(all(int(status[key], 16) == 0 for key in
                          (b'CapInh', b'CapPrm', b'CapEff', b'CapBnd', b'CapAmb')),
                      'relay_ci_capabilities=failed')
              require(status[b'NoNewPrivs'].strip() == b'1', 'relay_ci_nnp=failed')
              require(bounded('/proc/self/attr/current', 4096).strip() == PROFILE,
                      'relay_ci_profile_identity=failed')

          def namespaces():
              return {name: os.readlink('/proc/self/ns/' + name) for name in NAMESPACES}

          def nested_probe(depth):
              command = [
                  '/usr/bin/bwrap', '--die-with-parent', '--new-session',
                  '--unshare-user', '--uid', '1000', '--gid', '1000',
                  '--unshare-pid', '--unshare-net', '--unshare-ipc', '--unshare-uts',
                  '--clearenv', '--setenv', 'PATH', '/usr/bin:/bin',
                  '--ro-bind', '/usr', '/usr', '--symlink', 'usr/bin', '/bin',
                  '--symlink', 'usr/lib', '/lib', '--symlink', 'usr/lib64', '/lib64',
                  '--ro-bind', str(Path(__file__).resolve()), '/ci-probe.py',
                  '--proc', '/proc', '--dev', '/dev', '--tmpfs', '/tmp',
              ]
              # The outer fresh procfs must permit the nested bwrap's ID maps.
              # The leaf does not start another namespace and can make it read-only.
              if depth == 1:
                  command += ['--remount-ro', '/proc']
              command += [
                  '--remount-ro', '/dev',
                  '--remount-ro', '/', '--chdir', '/tmp', '--',
                  '/usr/bin/python3', '-I', '-S', '-B', '/ci-probe.py',
                  'namespace', str(depth), json.dumps(namespaces()),
              ]
              result = subprocess.run(command, capture_output=True, timeout=30)
              # Propagate only labels generated by this checked-in probe.
              labels = {b'relay_ci_' + item + b'=failed\n' for item in (
                  b'uid', b'gid', b'groups', b'capabilities', b'nnp',
                  b'profile_identity', b'state_read', b'state_bound',
                  b'namespace_identity', b'namespace_setup', b'precondition',
                  b'inspection',
              )}
              labels.update(('relay_ci_namespace_level' + str(level) + '=' + category + '\n').encode('ascii')
                            for level in (1, 2) for category in (*BWRAP_FAILURES, 'unknown'))
              if result.returncode and result.stdout in labels:
                  raise CheckFailure(result.stdout.decode('ascii').strip())
              if result.returncode or result.stderr:
                  # depth=2 starts level 1; the nested depth=1 starts level 2.
                  label = 'relay_ci_namespace_level' + str(3 - depth) + '='
                  raise CheckFailure(label + classify_bwrap(result.stderr))
              require(result.stdout == b'relay_ci_namespace=pass\n',
                      'relay_ci_namespace_output=failed')

          def run_gate(gate, uid, gid):
              check_identity(uid, gid)
              if gate == 'preflight':
                  nested_probe(2)
                  print('relay_ci_preflight=pass', flush=True)
                  return 0
              workspace = os.environ['GITHUB_WORKSPACE']
              revision = os.environ['GITHUB_SHA']
              require(Path(workspace).is_absolute() and Path(workspace).is_dir())
              require(re.fullmatch(r'[0-9a-f]{40}|[0-9a-f]{64}', revision) is not None)
              commands = {
                  'suite': ['tests/run_tests.py', '--suite', 'all', '--strict'],
                  'demo': ['examples/no_account_demo.py', '--json'],
                  'audit': ['tools/publication_audit.py', '--repo', workspace,
                            '--revision', revision],
              }
              # Existing gate output remains visible; launcher diagnostics do not.
              return subprocess.run(
                  ['/usr/bin/python3', '-I', '-S', '-B', *commands[gate]],
                  cwd=workspace, stderr=subprocess.STDOUT, timeout=900,
              ).returncode

          def launch(gate):
              uid, gid = os.getuid(), os.getgid()
              require(uid > 0 and gate in ('preflight', 'suite', 'demo', 'audit'))
              # Only these trusted system utilities execute with host privileges.
              # Repo/helper Python executes after all IDs and capabilities drop.
              command = [
                  '/usr/bin/sudo', '-n', '/usr/bin/env', '-i', 'PATH=/usr/bin:/bin',
                  '/usr/bin/aa-exec', '--immediate', '--profile', 'relay-ci', '--',
                  '/usr/bin/setpriv', '--reuid=' + str(uid), '--regid=' + str(gid),
                  '--clear-groups', '--inh-caps=-all', '--ambient-caps=-all',
                  '--bounding-set=-all', '--no-new-privs', '--reset-env', '--',
                  '/usr/bin/env', 'PATH=/usr/bin:/bin', 'LC_ALL=C.UTF-8',
                  'GITHUB_WORKSPACE=' + os.environ['GITHUB_WORKSPACE'],
                  'GITHUB_SHA=' + os.environ['GITHUB_SHA'],
                  '/usr/bin/python3', '-I', '-S', '-B', str(Path(__file__).resolve()),
                  'gate', gate, str(uid), str(gid),
              ]
              result = subprocess.run(command, stderr=subprocess.PIPE, timeout=960)
              require(result.returncode == 0, 'relay_ci_child=failed')
              require(not result.stderr, 'relay_ci_launcher_diagnostics=failed')
              return 0

          def main():
              if sys.argv[1] == 'launch':
                  return launch(sys.argv[2])
              if sys.argv[1] == 'gate':
                  return run_gate(sys.argv[2], int(sys.argv[3]), int(sys.argv[4]))
              if sys.argv[1] == 'namespace':
                  check_identity(1000, 1000)
                  depth, parent = int(sys.argv[2]), json.loads(sys.argv[3])
                  require(depth in (1, 2) and set(parent) == set(NAMESPACES))
                  require(all(value != parent[name] for name, value in namespaces().items()),
                          'relay_ci_namespace_identity=failed')
                  if depth > 1:
                      nested_probe(depth - 1)
                  print('relay_ci_namespace=pass', flush=True)
                  return 0
              raise ValueError('unknown CI operation')

          try:
              result = main()
          except CheckFailure as error:
              print(str(error), flush=True)
              result = 1
          except (OSError, ValueError, KeyError, IndexError, subprocess.SubprocessError):
              print('relay_ci_inspection=failed', flush=True)
              result = 1
          raise SystemExit(result)
          PY
          if ! /usr/sbin/apparmor_parser --skip-kernel-load --skip-cache --Werror \
              "$relay_ci_dir/profile" > "$relay_ci_dir/parser.log" 2>&1; then
            echo 'relay_ci_profile_compile=failed'
            exit 1
          fi
          # --add refuses collisions. No existing profile, cache, or sysctl is
          # replaced. VM disposal removes the temporary profile after all tasks.
          if ! sudo -n /usr/sbin/apparmor_parser --add --skip-cache --Werror \
              "$relay_ci_dir/profile" >> "$relay_ci_dir/parser.log" 2>&1; then
            echo 'relay_ci_profile_load=failed'
            exit 1
          fi
          printf 'RELAY_CI_DIR=%s\n' "$relay_ci_dir" >> "$GITHUB_ENV"
          echo 'relay_ci_profile=ready'

      - name: Verify ordinary UID and nested namespace execution
        run: /usr/bin/python3 -I -S -B "$RELAY_CI_DIR/ci.py" launch preflight

      - name: Require the complete no-account suite
        run: /usr/bin/python3 -I -S -B "$RELAY_CI_DIR/ci.py" launch suite

      - name: Run the installed scripted workflow
        run: /usr/bin/python3 -I -S -B "$RELAY_CI_DIR/ci.py" launch demo

      - name: Inspect the immutable publication selection
        run: /usr/bin/python3 -I -S -B "$RELAY_CI_DIR/ci.py" launch audit

      - name: Classify namespace denials after a failed check
        if: failure()
        run: |
          /usr/bin/python3 -I -S -B - <<'PY'
          import re, subprocess
          def records(data):
              if len(data) > 262144:
                  return []
              keys = rb'(?<!\S)(apparmor|operation|profile|comm|capname|class|info)='
              parsed = []
              for line in data.splitlines():
                  pairs = re.findall(keys + rb'"([^"\\\r\n]*)"(?=\s|$)', line)
                  # Reject duplicates and malformed or escaped known fields.
                  if len(pairs) == len(dict(pairs)) == len(re.findall(keys, line)):
                      parsed.append(dict(pairs))
              return parsed
          def classify(data):
              denied = [r for r in records(data) if all(r.get(k) == v for k, v in {b'apparmor': b'DENIED', b'operation': b'capable', b'comm': b'bwrap', b'capname': b'net_admin'}.items())]
              if any(r.get(b'profile') == b'unpriv_bwrap' for r in denied):
                  return 'known_bwrap_profile_net_admin_denial'
              return 'apparmor_capability_denial' if denied else 'unknown'
          def classify_profile(data):
              denied = [r for r in records(data) if r.get(b'apparmor') == b'DENIED' and r.get(b'profile') == b'relay-ci']
              categories = (
                  ('disconnected_path_denial', b'info', (b'Failed name lookup - disconnected path',)),
                  ('pivot_root_denial', b'operation', (b'pivotroot',)),
                  ('mount_denial', b'operation', (b'mount', b'umount')),
                  ('exec_denial', b'operation', (b'exec',)),
                  ('capability_denial', b'operation', (b'capable',)),
                  ('file_denial', b'class', (b'file',)),
              )
              for category, key, values in categories:
                  if any(r.get(key) in values for r in denied):
                      return category
              return 'unknown'
          result = profile_result = 'unknown'
          try:
              observed = subprocess.run(['sudo', '-n', 'journalctl', '-k', '--no-pager', '-n', '400', '--output=cat'], stdout=subprocess.PIPE, stderr=subprocess.DEVNULL, timeout=10, check=False)
              if observed.returncode == 0 and len(observed.stdout) <= 262144:
                  result = classify(observed.stdout)
                  profile_result = classify_profile(observed.stdout)
          except (OSError, subprocess.SubprocessError):
              pass
          print('namespace_network_policy=' + result)
          print('relay_ci_profile_policy=' + profile_result)
          PY
